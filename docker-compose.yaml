services:
  next-js:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/mydatabase
      - NEXT_PUBLIC_DEVELOPMENT_URL=http://localhost:3000
      - NEXT_PUBLIC_PRODUCTION_URL=https://chidosakht-test.vercel.app
      - JWT_SECRET_KEY=4cdae5f20fc47cf4f9b21a95bb4c14aa99cbdf7c8d23bed64ebf15193c038dc0
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - AWS_S3_BUCKET=my-local-bucket
      - AWS_S3_ENDPOINT=http://minio:9000
      - DEVELOPMENT_ENVIRONMENT=docker
    volumes:
      - .:/app
      - /app/node_modules
    command: ["/bin/sh", "-c", "/app/entrypoint.sh"]

  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
volumes:
  postgres_data: # Defines a volume for PostgreSQL data
  minio_data:
